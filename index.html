 })

function C(){return S.project?S.contractors.filter(function(x){return x.project_id===S.project.id}):[]}

therText);lines.push('Total Manpower: '+dayManpower(selectedDate)+' workers');lines.push('');lines.push('2. Daily Work Summary');if(!works.length)lines.push('No site work records for this date.');works.forEach(function(w,i){var it=S.items.find(function(x){return x.id===w.work_item_id}),c=S.contractors.find(function(x){return x.id===w.contractor_id});lines.push((i+1)+'. '+(c?c.name:'—'));lines.push('   Work Item: '+(it?it.name:'—'));lines.push('   Work Area: '+(w.location||'—'));lines.push('   Manpower: '+(w.manpower||0)+' workers');lines.push('   Planned Quantity: '+(w.planned_quantity||0)+(it&&it.unit?' '+it.unit:''));lines.push('   Completed Quantity: '+(w.quantity||0)+(it&&it.unit?' '+it.unit:''));lines.push('   Work Description: '+(w.note||'—'));lines.push('   Delay / Issue: '+delayLabel(w.delay_reason));lines.push('   Site Photo: '+(w.photo_url?'Uploaded':'Not uploaded'));lines.push('')});lines.push('3. Deliveries / Material Received');if(!del.length)lines.push('No delivery records for this date.');del.forEach(function(d,i){lines.push((i+1)+'. Delivery Order No.: '+(d.delivery_no||'—'));lines.push('   Supplier: '+(d.supplier||'—'));lines.push('   Materials / Description: '+(d.description||'—'));lines.push('   Received By: '+(d.received_by||'—'));lines.push('')});lines.push('4. Remarks');lines.push('Add any outstanding, delayed, or follow-up items here.')}return lines.join('\n')}
