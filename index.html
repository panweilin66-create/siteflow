<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>SiteFlow</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111827;--muted:#6b7280;--blue:#0a84ff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--line:#e5e7eb;--shadow:0 1px 2px rgba(0,0,0,.04)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue",Arial,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:#111827}.login-card{width:min(390px,100%);background:#fff;border-radius:28px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.logo{font-size:44px}.muted{color:var(--muted)}h1,h2,h3{letter-spacing:-.02em}.login h1{margin:7px 0 3px}.field{margin-top:14px}.field label{display:block;font-size:13px;font-weight:750;color:var(--muted);margin:0 0 6px 2px}.input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:13px;background:#fff;padding:13px 14px;font-size:16px;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--blue)}textarea{min-height:92px;resize:vertical}.btn{border:0;border-radius:14px;min-height:48px;padding:12px 15px;font-size:15px;font-weight:800;background:var(--blue);color:#fff}.btn:disabled{opacity:.55}.btn.full{width:100%;margin-top:15px}.btn.secondary{background:#e5e7eb;color:#111827}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.danger{background:#fee2e2;color:#991b1b}.btn.smallbtn{min-height:38px;padding:8px 11px;font-size:13px;border-radius:11px}.status{font-size:13px;margin-top:13px;min-height:19px}.status.err{color:#b91c1c}.status.ok{color:#166534}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding:calc(13px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.top h1{margin:2px 0 12px;font-size:28px}.pill{padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}.hero{background:#111827;color:#fff}.hero .muted{color:#cbd5e1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:34px;font-weight:850}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick .btn{min-height:64px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.small{font-size:12px}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:var(--blue)}.section-title{font-size:19px;font-weight:820;margin:18px 4px 10px}.empty{text-align:center;color:var(--muted);padding:25px 6px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800}.badge.off{background:#f3f4f6;color:#6b7280}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid #ddd;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav button{flex:1;border:0;background:none;color:#8e8e93;font-size:11px;font-weight:750;padding:8px 2px}.nav button.active{color:var(--blue)}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px;padding-bottom:2px}.tabs button{white-space:nowrap;border:0;background:#e5e7eb;border-radius:999px;padding:9px 12px;font-weight:750}.tabs button.active{background:#111827;color:#fff}.toolbar{display:flex;gap:7px;align-items:center}.toolbar .btn{width:auto}.photo{border:2px dashed #cbd5e1;border-radius:14px;padding:14px;text-align:center}.danger-zone{border:1px solid #fecaca}.record{background:#f9fafb;border-radius:13px;padding:12px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:end center;z-index:50}.sheet{width:min(430px,100%);max-height:90vh;overflow:auto;background:#f2f2f7;border-radius:24px 24px 0 0;padding:18px 14px calc(20px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 10px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:94px;background:#111827;color:#fff;padding:10px 14px;border-radius:999px;z-index:80;max-width:90%;font-size:13px;text-align:center}.sync{font-size:11px;color:var(--muted);margin-top:2px}
@media(min-width:700px){body{padding:20px}.app{border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.12);background:var(--bg)}.nav{bottom:20px;border-radius:0 0 28px 28px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">👷</div>
    <h1>SiteFlow</h1>
    <div class="muted">工程現場雲端管理系統</div>
    <div class="field"><label>Email</label><input id="email" class="input" type="email" autocomplete="email" value="panweilin666@gmail.com"></div>
    <div class="field"><label>密碼</label><input id="password" class="input" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn full">登入</button>
    <div id="loginStatus" class="status">資料庫、照片與帳號均使用 Supabase Cloud。</div>
  </div>
</div>
<div id="app" class="app hidden">
  <div class="top">
    <div><div id="projectName" class="muted small">SiteFlow Cloud</div><h1 id="pageTitle">今日現場</h1><div id="lastSync" class="sync"></div></div>
    <span id="rolePill" class="pill"></span>
  </div>
  <main id="main"></main>
</div>
<nav id="nav" class="nav hidden">
  <button data-tab="home" class="active">首頁</button><button data-tab="attendance">點名</button><button data-tab="work">施工</button><button data-tab="progress">進度</button><button data-tab="admin">管理</button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
(function(){
'use strict';
var BASE='https://eohjkqciencfnowevfwy.supabase.co';
var KEY='sb_publishable_ceGXaUhcq1jr_FaCDngqwg_-LHOi435';
var token='',uid='',profile=null,tab='home',adminTab='projects';
var S={projects:[],project:null,contractors:[],workers:[],items:[],attendance:[],daily:[],profiles:[]};
function el(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function today(){var d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+x}
function fmtTime(v){if(!v)return '';try{return new Date(v).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},2200)}
function authHeaders(json){var h={'apikey':KEY,'Authorization':'Bearer '+token};if(json!==false)h['Content-Type']='application/json';return h}
function req(path,opt){opt=opt||{};if(!opt.headers)opt.headers=authHeaders();return fetch(BASE+path,opt).then(function(r){return r.text().then(function(t){var d=null;try{d=t?JSON.parse(t):null}catch(e){d=t}if(!r.ok)throw new Error(d&&d.message?d.message:(d&&d.error_description?d.error_description:(t||('HTTP '+r.status))));return d})})}
function setStatus(t,cls){el('loginStatus').textContent=t;el('loginStatus').className='status '+(cls||'')}
function doLogin(){var email=el('email').value.trim(),password=el('password').value;if(!email||!password)return setStatus('請輸入 Email 和密碼','err');setStatus('正在登入…','');el('loginBtn').disabled=true;fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'登入失敗');return d})}).then(function(d){token=d.access_token;uid=d.user.id;sessionStorage.setItem('sf_token',token);sessionStorage.setItem('sf_uid',uid);return boot()}).catch(function(e){setStatus(e.message,'err')}).finally(function(){el('loginBtn').disabled=false})}
function boot(){return req('/rest/v1/profiles?select=*&id=eq.'+encodeURIComponent(uid)).then(function(p){profile=p&&p[0];if(!profile)throw new Error('找不到使用者 Profile');if(profile.active===false)throw new Error('此帳號已停用');return loadAll()}).then(function(){el('login').classList.add('hidden');el('app').classList.remove('hidden');el('nav').classList.remove('hidden');render()})}
function loadAll(){return Promise.all([
 req('/rest/v1/projects?select=*&order=created_at.asc'),
 req('/rest/v1/contractors?select=*&order=name.asc'),
 req('/rest/v1/workers?select=*&order=name.asc'),
 req('/rest/v1/work_items?select=*&order=name.asc'),
 req('/rest/v1/attendance?select=*&work_date=eq.'+today()),
 req('/rest/v1/daily_work?select=*&order=created_at.desc&limit=100'),
 req('/rest/v1/profiles?select=id,email,full_name,role,active&order=email.asc')
 ]).then(function(a){S.projects=a[0]||[];var lastProjectId=sessionStorage.getItem('sf_project');S.project=S.projects.find(function(p){return p.id===lastProjectId})||S.projects[0]||null;S.contractors=a[1]||[];S.workers=a[2]||[];S.items=a[3]||[];S.attendance=a[4]||[];S.daily=a[5]||[];S.profiles=a[6]||[];el('lastSync').textContent='雲端同步 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})})}
function title(){return {home:'今日現場',attendance:'工人點名',work:'施工回報',progress:'工程進度',admin:'管理中心'}[tab]}
function pct(x){return Number(x.planned)>0?Math.min(100,Math.round((Number(x.completed)||0)/Number(x.planned)*100)):0}
function currentContractors(){return S.project?S.contractors.filter(function(c){return c.project_id===S.project.id}):[]}
function currentItems(){return S.project?S.items.filter(function(i){return i.project_id===S.project.id&&i.active!==false}):[]}
function currentWorkers(){var ids=currentContractors().map(function(c){return c.id});return S.workers.filter(function(w){return ids.indexOf(w.contractor_id)>=0&&w.active!==false})}
function render(){el('projectName').textContent=S.project?S.project.name:'尚未建立專案';el('pageTitle').textContent=title();el('rolePill').textContent=profile?profile.role:'';document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});el('main').innerHTML=screen();wire()}
function screen(){if(tab==='attendance')return attendance();if(tab==='work')return work();if(tab==='progress')return progress();if(tab==='admin')return admin();return home()}
function projectSwitcher(){if(S.projects.length<=1)return '';return '<div class="card"><div class="field" style="margin-top:0"><label>目前專案</label><select id="projectSwitch">'+S.projects.map(function(p){return '<option value="'+p.id+'" '+(S.project&&S.project.id===p.id?'selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select></div></div>'}
function home(){var workers=currentWorkers(),items=currentItems(),present=S.attendance.filter(function(a){return a.present&&workers.some(function(w){return w.id===a.worker_id})}).length,reports=S.daily.filter(function(d){return d.work_date===today()&&items.some(function(i){return i.id===d.work_item_id})}).length;return projectSwitcher()+'<div class="card hero"><div class="muted">今日概況</div><div class="grid2" style="margin-top:14px"><div><div class="stat">'+present+'</div><small>已到工人</small></div><div><div class="stat">'+reports+'</div><small>施工回報</small></div></div></div><div class="quick"><button class="btn" data-go="attendance">👷 工人點名</button><button class="btn" data-go="work">📝 施工回報</button></div><div class="section-title">工項進度</div><div class="card">'+(items.length?items.slice(0,10).map(function(x){return '<div class="item"><div class="row"><b>'+esc(x.name)+'</b><b>'+pct(x)+'%</b></div><div class="muted small">'+esc(x.location||'')+' · '+esc(x.completed||0)+' / '+esc(x.planned||0)+' '+esc(x.unit||'')+'</div><div class="progress"><span style="width:'+pct(x)+'%"></span></div></div>'}).join(''):'<div class="empty">尚未建立工項</div>')+'</div>'}
function attendance(){var active=currentWorkers();return projectSwitcher()+'<div class="card"><div class="row"><div><b>今日 '+today()+'</b><div class="muted small">點一下即可切換到場狀態</div></div><span class="pill">'+S.attendance.filter(function(a){return a.present&&active.some(function(w){return w.id===a.worker_id})}).length+' 人已到</span></div></div><div class="card">'+(active.length?active.map(function(w){var a=S.attendance.find(function(x){return x.worker_id===w.id}),c=S.contractors.find(function(x){return x.id===w.contractor_id});return '<div class="item row"><div><b>'+esc(w.name)+'</b><div class="muted small">'+esc(c?c.name:'')+' · '+esc(w.trade||'')+(a&&a.present&&a.check_in?' · '+fmtTime(a.check_in):'')+'</div></div><button class="btn '+(a&&a.present?'secondary':'green')+' smallbtn" style="width:82px" data-mark="'+w.id+'" data-present="'+(!(a&&a.present))+'">'+(a&&a.present?'已到':'點名')+'</button></div>'}).join(''):'<div class="empty">請先到「管理 → 工人」建立工人</div>')+'</div>'}
function work(){var cs=currentContractors(),items=currentItems();if(!S.project)return '<div class="card empty">請先到管理頁建立專案</div>';if(!items.length)return '<div class="card empty">請先到管理頁建立工項</div>';return projectSwitcher()+'<div class="card"><div class="field" style="margin-top:0"><label>分包商</label><select id="wc">'+cs.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="field"><label>工項</label><select id="wi">'+items.map(function(i){return '<option value="'+i.id+'">'+esc(i.name)+' · '+esc(i.location||'')+'</option>'}).join('')+'</select></div><div class="grid2"><div class="field"><label>出工人數</label><input id="wm" class="input" type="number" min="0" value="1"></div><div class="field"><label>完成數量</label><input id="wq" class="input" type="number" min="0" step="0.01" value="0"></div></div><div class="field"><label>施作內容</label><textarea id="wn"></textarea></div><div class="field"><label>延誤原因</label><select id="wd"><option>無</option><option>圖面問題</option><option>材料未到</option><option>人力不足</option><option>前置工項未完成</option><option>RFI Pending</option><option>天候</option><option>其他</option></select></div><div class="field photo"><label>📷 現場照片</label><input id="wp" class="input" type="file" accept="image/*" capture="environment"></div><button id="saveWork" class="btn full">儲存到雲端</button></div>'}
function progress(){var items=currentItems();return projectSwitcher()+'<div class="card">'+(items.length?items.map(function(x){return '<div class="item"><div class="row"><b>'+esc(x.name)+'</b><b>'+pct(x)+'%</b></div><div class="muted small">'+esc(x.location||'')+' · '+esc(x.completed||0)+' / '+esc(x.planned||0)+' '+esc(x.unit||'')+'</div><div class="progress"><span style="width:'+pct(x)+'%"></span></div></div>'}).join(''):'<div class="empty">尚未建立工項</div>')+'</div><div class="section-title">最近施工紀錄</div><div class="card">'+recentWork()+'</div>'}
function recentWork(){var items=currentItems(),rows=S.daily.filter(function(d){return items.some(function(i){return i.id===d.work_item_id})}).slice(0,10);if(!rows.length)return '<div class="empty">尚無施工紀錄</div>';return rows.map(function(d){var i=S.items.find(function(x){return x.id===d.work_item_id}),c=S.contractors.find(function(x){return x.id===d.contractor_id});return '<div class="record"><div class="row"><b>'+esc(i?i.name:'施工紀錄')+'</b><span class="badge">'+esc(d.work_date)+'</span></div><div class="muted small">'+esc(c?c.name:'')+' · '+esc(d.location||'')+' · '+esc(d.manpower)+'人 · '+esc(d.quantity)+'</div>'+(d.note?'<div class="small" style="margin-top:5px">'+esc(d.note)+'</div>':'')+(d.delay_reason&&d.delay_reason!=='無'?'<div class="small" style="color:#b45309;margin-top:4px">延誤：'+esc(d.delay_reason)+'</div>':'')+'</div>'}).join('')}
function canManage(){return profile&&['admin','site_manager'].indexOf(profile.role)>=0}
function admin(){if(!canManage())return '<div class="card empty">你的帳號沒有管理權限。</div>';var ts=[['projects','專案'],['contractors','分包商'],['workers','工人'],['items','工項'],['users','使用者']];return '<div class="tabs">'+ts.map(function(x){return '<button data-admin-tab="'+x[0]+'" class="'+(adminTab===x[0]?'active':'')+'">'+x[1]+'</button>'}).join('')+'</div>'+adminBody()+'<button id="refreshBtn" class="btn full secondary">重新同步雲端</button><button id="logoutBtn" class="btn full secondary">登出</button>'}
function adminBody(){if(adminTab==='projects')return adminProjects();if(adminTab==='contractors')return adminContractors();if(adminTab==='workers')return adminWorkers();if(adminTab==='items')return adminItems();return adminUsers()}
function adminProjects(){return '<div class="card"><div class="row"><h3 style="margin:0">專案</h3><button class="btn smallbtn" data-add="project">新增</button></div>'+(S.projects.length?S.projects.map(function(p){return '<div class="item row"><div><b>'+esc(p.name)+'</b><div class="muted small">'+esc(p.status||'active')+(p.start_date?' · '+esc(p.start_date):'')+(p.end_date?' → '+esc(p.end_date):'')+'</div></div><div class="toolbar"><button class="btn secondary smallbtn" data-edit="project:'+p.id+'">編輯</button><button class="btn danger smallbtn" data-del="projects:'+p.id+'">刪除</button></div></div>'}).join(''):'<div class="empty">尚無專案</div>')+'</div>'}
function adminContractors(){var rows=S.project?currentContractors():S.contractors;return '<div class="card"><div class="row"><h3 style="margin:0">分包商</h3><button class="btn smallbtn" data-add="contractor">新增</button></div>'+(rows.length?rows.map(function(c){return '<div class="item row"><div><b>'+esc(c.name)+'</b><div class="muted small">'+esc(c.trade||'')+(c.contact_name?' · '+esc(c.contact_name):'')+'</div><span class="badge '+(c.active?'':'off')+'">'+(c.active?'Active':'Inactive')+'</span></div><div class="toolbar"><button class="btn secondary smallbtn" data-edit="contractor:'+c.id+'">編輯</button><button class="btn danger smallbtn" data-del="contractors:'+c.id+'">刪除</button></div></div>'}).join(''):'<div class="empty">尚無分包商</div>')+'</div>'}
function adminWorkers(){var rows=S.project?S.workers.filter(function(w){return currentContractors().some(function(c){return c.id===w.contractor_id})}):S.workers;return '<div class="card"><div class="row"><h3 style="margin:0">工人</h3><button class="btn smallbtn" data-add="worker">新增</button></div>'+(rows.length?rows.map(function(w){var c=S.contractors.find(function(x){return x.id===w.contractor_id});return '<div class="item row"><div><b>'+esc(w.name)+'</b><div class="muted small">'+esc(c?c.name:'')+' · '+esc(w.trade||'')+(w.worker_no?' · '+esc(w.worker_no):'')+'</div><span class="badge '+(w.active?'':'off')+'">'+(w.active?'Active':'Inactive')+'</span></div><div class="toolbar"><button class="btn secondary smallbtn" data-edit="worker:'+w.id+'">編輯</button><button class="btn danger smallbtn" data-del="workers:'+w.id+'">刪除</button></div></div>'}).join(''):'<div class="empty">尚無工人</div>')+'</div>'}
function adminItems(){var rows=S.project?S.items.filter(function(i){return i.project_id===S.project.id}):S.items;return '<div class="card"><div class="row"><h3 style="margin:0">工項</h3><button class="btn smallbtn" data-add="item">新增</button></div>'+(rows.length?rows.map(function(i){return '<div class="item row"><div><b>'+esc(i.name)+'</b><div class="muted small">'+esc(i.location||'')+' · '+pct(i)+'% · '+esc(i.completed)+'/'+esc(i.planned)+' '+esc(i.unit||'')+'</div><span class="badge '+(i.active?'':'off')+'">'+(i.active?'Active':'Inactive')+'</span></div><div class="toolbar"><button class="btn secondary smallbtn" data-edit="item:'+i.id+'">編輯</button><button class="btn danger smallbtn" data-del="work_items:'+i.id+'">刪除</button></div></div>'}).join(''):'<div class="empty">尚無工項</div>')+'</div>'}
function adminUsers(){return '<div class="card"><h3 style="margin-top:0">使用者角色</h3>'+S.profiles.map(function(p){return '<div class="item"><div class="row"><div><b>'+esc(p.email||'')+'</b><div class="muted small">'+esc(p.full_name||'')+'</div></div><span class="badge '+(p.active?'':'off')+'">'+(p.active?'Active':'Inactive')+'</span></div><div class="grid2" style="margin-top:8px"><select data-role="'+p.id+'"><option value="admin" '+(p.role==='admin'?'selected':'')+'>admin</option><option value="site_manager" '+(p.role==='site_manager'?'selected':'')+'>site_manager</option><option value="site_engineer" '+(p.role==='site_engineer'?'selected':'')+'>site_engineer</option><option value="foreman" '+(p.role==='foreman'?'selected':'')+'>foreman</option></select><select data-user-active="'+p.id+'"><option value="true" '+(p.active?'selected':'')+'>Active</option><option value="false" '+(!p.active?'selected':'')+'>Inactive</option></select></div></div>'}).join('')+'<div class="muted small" style="margin-top:10px">新增登入帳號需在 Supabase Authentication → Users 建立；建立後會自動出現在此頁。</div></div>'}
function wire(){document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){tab=b.dataset.go;render()}});document.querySelectorAll('[data-mark]').forEach(function(b){b.onclick=function(){mark(b.dataset.mark,b.dataset.present==='true')}});var sw=el('saveWork');if(sw)sw.onclick=saveWork;document.querySelectorAll('[data-admin-tab]').forEach(function(b){b.onclick=function(){adminTab=b.dataset.adminTab;render()}});document.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(){openForm(b.dataset.add,null)}});document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){var a=b.dataset.edit.split(':');openForm(a[0],a[1])}});document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var a=b.dataset.del.split(':');removeRow(a[0],a[1])}});document.querySelectorAll('[data-role]').forEach(function(s){s.onchange=function(){updateProfile(s.dataset.role,{role:s.value})}});document.querySelectorAll('[data-user-active]').forEach(function(s){s.onchange=function(){updateProfile(s.dataset.userActive,{active:s.value==='true'})}});var ps=el('projectSwitch');if(ps)ps.onchange=function(){sessionStorage.setItem('sf_project',ps.value);S.project=S.projects.find(function(p){return p.id===ps.value})||S.project;render()};var lo=el('logoutBtn');if(lo)lo.onclick=logout;var rr=el('refreshBtn');if(rr)rr.onclick=function(){loadAll().then(render).then(function(){toast('已重新同步')}).catch(function(e){toast(e.message)})}}
function mark(id,present){var payload={worker_id:id,work_date:today(),present:present,check_in:present?new Date().toISOString():null,check_out:present?null:new Date().toISOString(),created_by:uid};req('/rest/v1/attendance?on_conflict=worker_id,work_date',{method:'POST',headers:Object.assign(authHeaders(),{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(payload)}).then(function(){return loadAll()}).then(render).catch(function(e){toast(e.message)})}
function uploadPhoto(file){if(!file)return Promise.resolve(null);var ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'');var path=(S.project?S.project.id:'general')+'/'+today()+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;return fetch(BASE+'/storage/v1/object/site-photos/'+path,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':file.type||'image/jpeg','x-upsert':'false'},body:file}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||'照片上傳失敗')});return path})}
function saveWork(){var item=S.items.find(function(x){return x.id===el('wi').value}),q=Number(el('wq').value)||0,file=el('wp').files[0];toast('正在儲存…');uploadPhoto(file).then(function(photo){var p={work_date:today(),contractor_id:el('wc').value||null,work_item_id:item?item.id:null,location:item?item.location:'',manpower:Number(el('wm').value)||0,quantity:q,note:el('wn').value.trim(),delay_reason:el('wd').value,photo_url:photo,created_by:uid};return req('/rest/v1/daily_work',{method:'POST',headers:Object.assign(authHeaders(),{'Prefer':'return=minimal'}),body:JSON.stringify(p)})}).then(function(){if(item&&q)return req('/rest/v1/work_items?id=eq.'+item.id,{method:'PATCH',headers:Object.assign(authHeaders(),{'Prefer':'return=minimal'}),body:JSON.stringify({completed:(Number(item.completed)||0)+q})})}).then(function(){return loadAll()}).then(function(){tab='home';render();toast('施工回報已儲存')}).catch(function(e){toast(e.message)})}
function openForm(type,id){var data=null;if(id){if(type==='project')data=S.projects.find(function(x){return x.id===id});if(type==='contractor')data=S.contractors.find(function(x){return x.id===id});if(type==='worker')data=S.workers.find(function(x){return x.id===id});if(type==='item')data=S.items.find(function(x){return x.id===id})}var edit=!!id,h='<h2>'+(edit?'編輯':'新增')+({project:'專案',contractor:'分包商',worker:'工人',item:'工項'}[type])+'</h2>';
if(type==='project'){h+='<div class="field"><label>專案名稱</label><input id="f1" class="input" value="'+esc(data?data.name:'')+'"></div><div class="field"><label>Status</label><select id="f2"><option value="active" '+(data&&data.status==='active'?'selected':'')+'>active</option><option value="planning" '+(data&&data.status==='planning'?'selected':'')+'>planning</option><option value="completed" '+(data&&data.status==='completed'?'selected':'')+'>completed</option><option value="on_hold" '+(data&&data.status==='on_hold'?'selected':'')+'>on_hold</option></select></div><div class="grid2"><div class="field"><label>開始日期</label><input id="f3" class="input" type="date" value="'+esc(data&&data.start_date?data.start_date:'')+'"></div><div class="field"><label>結束日期</label><input id="f4" class="input" type="date" value="'+esc(data&&data.end_date?data.end_date:'')+'"></div></div>'}
if(type==='contractor'){h+='<div class="field"><label>專案</label><select id="fp">'+S.projects.map(function(p){return '<option value="'+p.id+'" '+((data?data.project_id:(S.project?S.project.id:''))===p.id?'selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select></div><div class="field"><label>名稱</label><input id="f1" class="input" value="'+esc(data?data.name:'')+'"></div><div class="field"><label>承攬類別</label><input id="f2" class="input" value="'+esc(data?data.trade||'':'')+'"></div><div class="grid2"><div class="field"><label>聯絡人</label><input id="f3" class="input" value="'+esc(data?data.contact_name||'':'')+'"></div><div class="field"><label>電話</label><input id="f4" class="input" value="'+esc(data?data.contact_phone||'':'')+'"></div></div><div class="field"><label>狀態</label><select id="fa"><option value="true" '+(!data||data.active?'selected':'')+'>Active</option><option value="false" '+(data&&!data.active?'selected':'')+'>Inactive</option></select></div>'}
if(type==='worker'){var cs=S.project?currentContractors():S.contractors;h+='<div class="field"><label>分包商</label><select id="fc">'+cs.map(function(c){return '<option value="'+c.id+'" '+((data?data.contractor_id:'')===c.id?'selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="field"><label>姓名</label><input id="f1" class="input" value="'+esc(data?data.name:'')+'"></div><div class="grid2"><div class="field"><label>工人編號</label><input id="f2" class="input" value="'+esc(data?data.worker_no||'':'')+'"></div><div class="field"><label>工種</label><input id="f3" class="input" value="'+esc(data?data.trade||'':'')+'"></div></div><div class="field"><label>電話</label><input id="f4" class="input" value="'+esc(data?data.phone||'':'')+'"></div><div class="field"><label>狀態</label><select id="fa"><option value="true" '+(!data||data.active?'selected':'')+'>Active</option><option value="false" '+(data&&!data.active?'selected':'')+'>Inactive</option></select></div>'}
if(type==='item'){var cs2=S.project?currentContractors():S.contractors;h+='<div class="field"><label>分包商</label><select id="fc"><option value="">未指定</option>'+cs2.map(function(c){return '<option value="'+c.id+'" '+((data?data.contractor_id:'')===c.id?'selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="field"><label>工項名稱</label><input id="f1" class="input" value="'+esc(data?data.name:'')+'"></div><div class="field"><label>施工區域</label><input id="f2" class="input" value="'+esc(data?data.location||'':'')+'"></div><div class="grid2"><div class="field"><label>計畫數量</label><input id="f3" class="input" type="number" step="0.01" value="'+esc(data?data.planned:0)+'"></div><div class="field"><label>已完成</label><input id="f4" class="input" type="number" step="0.01" value="'+esc(data?data.completed:0)+'"></div></div><div class="grid2"><div class="field"><label>單位</label><input id="f5" class="input" value="'+esc(data?data.unit||'':'')+'"></div><div class="field"><label>狀態</label><select id="fa"><option value="true" '+(!data||data.active?'selected':'')+'>Active</option><option value="false" '+(data&&!data.active?'selected':'')+'>Inactive</option></select></div></div><div class="grid2"><div class="field"><label>預計開始</label><input id="f6" class="input" type="date" value="'+esc(data&&data.planned_start?data.planned_start:'')+'"></div><div class="field"><label>預計完成</label><input id="f7" class="input" type="date" value="'+esc(data&&data.planned_end?data.planned_end:'')+'"></div></div>'}
h+='<button id="modalSave" class="btn full">儲存</button><button id="modalCancel" class="btn full secondary">取消</button>';el('sheet').innerHTML=h;el('modal').classList.remove('hidden');el('modalCancel').onclick=closeModal;el('modalSave').onclick=function(){saveForm(type,id)}}
function closeModal(){el('modal').classList.add('hidden')}
function saveForm(type,id){var table,p;if(type==='project'){table='projects';p={name:el('f1').value.trim(),status:el('f2').value,start_date:el('f3').value||null,end_date:el('f4').value||null}}if(type==='contractor'){table='contractors';p={project_id:el('fp').value,name:el('f1').value.trim(),trade:el('f2').value.trim()||null,contact_name:el('f3').value.trim()||null,contact_phone:el('f4').value.trim()||null,active:el('fa').value==='true'}}if(type==='worker'){table='workers';p={contractor_id:el('fc').value,name:el('f1').value.trim(),worker_no:el('f2').value.trim()||null,trade:el('f3').value.trim()||null,phone:el('f4').value.trim()||null,active:el('fa').value==='true'}}if(type==='item'){if(!S.project)return toast('請先建立專案');table='work_items';p={project_id:S.project.id,contractor_id:el('fc').value||null,name:el('f1').value.trim(),location:el('f2').value.trim()||null,planned:Number(el('f3').value)||0,completed:Number(el('f4').value)||0,unit:el('f5').value.trim()||null,active:el('fa').value==='true',planned_start:el('f6').value||null,planned_end:el('f7').value||null}}if(!p||!p.name)return toast('名稱不可空白');var path='/rest/v1/'+table+(id?'?id=eq.'+id:'');req(path,{method:id?'PATCH':'POST',headers:Object.assign(authHeaders(),{'Prefer':'return=minimal'}),body:JSON.stringify(p)}).then(function(){closeModal();return loadAll()}).then(render).then(function(){toast(id?'已更新':'已新增')}).catch(function(e){toast(e.message)})}
function removeRow(table,id){var warning=table==='projects'?'刪除專案會連同該專案的分包商、工人與工項一起刪除。確定？':'確定刪除？';if(!confirm(warning))return;req('/rest/v1/'+table+'?id=eq.'+id,{method:'DELETE',headers:authHeaders()}).then(function(){if(table==='projects'&&S.project&&S.project.id===id)sessionStorage.removeItem('sf_project');return loadAll()}).then(render).then(function(){toast('已刪除')}).catch(function(e){toast(e.message)})}
function updateProfile(id,patch){req('/rest/v1/profiles?id=eq.'+id,{method:'PATCH',headers:Object.assign(authHeaders(),{'Prefer':'return=minimal'}),body:JSON.stringify(patch)}).then(function(){toast('使用者設定已更新');return loadAll()}).catch(function(e){toast(e.message)})}
function logout(){token='';uid='';profile=null;sessionStorage.removeItem('sf_token');sessionStorage.removeItem('sf_uid');el('app').classList.add('hidden');el('nav').classList.add('hidden');el('login').classList.remove('hidden');setStatus('已登出','')}
el('loginBtn').onclick=doLogin;el('password').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render()}});var st=sessionStorage.getItem('sf_token'),su=sessionStorage.getItem('sf_uid');if(st&&su){token=st;uid=su;boot().catch(function(){logout()})}
})();
</script>
</body></html>
